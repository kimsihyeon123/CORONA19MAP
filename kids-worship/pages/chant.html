<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>챈트영상 · 유아부</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>챈트영상</h1>
    <nav class="nav">
      <a href="/index.html">홈</a>
      <a href="/pages/pangpang.html">팡팡바이블</a>
      <a href="/pages/resources.html">교육자료</a>
      <a href="/pages/english.html">영어학습</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h3>나의 챈트 재생목록</h3>
      <div class="row">
        <div style="flex:2;min-width:260px">
          <label>제목</label>
          <input id="title" placeholder="예: 감사송 1" />
        </div>
        <div style="flex:3;min-width:260px">
          <label>유튜브 링크 또는 동영상 ID</label>
          <input id="url" placeholder="예: https://youtu.be/xxxx 또는 abcDEF123" />
        </div>
        <div style="align-self:flex-end">
          <button class="button primary" id="addBtn">추가</button>
        </div>
      </div>
      <p class="alert">Tip: YouTube 플레이리스트(playlist) 임베드 URL도 그대로 저장할 수 있어요.</p>
    </div>

    <div class="list" id="list"></div>
  </main>

  <footer class="app-footer container">
    <div class="footer-actions">
      <button class="button" id="exportBtn">내보내기(JSON)</button>
      <button class="button" id="clearBtn">전체삭제</button>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    const listEl = document.getElementById('list');
    const inputTitle = document.getElementById('title');
    const inputUrl = document.getElementById('url');
    const addBtn = document.getElementById('addBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    function render(){
      const items = KidsApp.Store.getChants('ko');
      listEl.innerHTML = '';
      if(!items.length){
        const empty = document.createElement('p');
        empty.className = 'alert';
        empty.textContent = '아직 영상이 없어요. 위에 유튜브 링크를 추가해 보세요!';
        listEl.appendChild(empty);
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'video-grid';
      items.forEach((item, idx)=>{
        const card = document.createElement('div');
        card.className = 'card';
        const h = document.createElement('div');
        h.className = 'row';
        h.innerHTML = `<h3 style="margin:0;flex:1">${item.title||'무제'}</h3>`+
        `<button class='button small' data-idx='${idx}' data-act='up'>▲</button>`+
        `<button class='button small' data-idx='${idx}' data-act='down'>▼</button>`+
        `<button class='button small' data-idx='${idx}' data-act='del'>삭제</button>`;
        const iframe = document.createElement('iframe');
        iframe.className = 'video';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.src = item.embed;
        card.appendChild(h);
        card.appendChild(iframe);
        grid.appendChild(card);
      });
      listEl.appendChild(grid);
      listEl.addEventListener('click', onListClick);
    }

    function onListClick(e){
      const btn = e.target.closest('button[data-act]');
      if(!btn) return;
      const idx = Number(btn.dataset.idx);
      const act = btn.dataset.act;
      const items = KidsApp.Store.getChants('ko');
      if(act==='del'){ items.splice(idx,1); }
      if(act==='up' && idx>0){ [items[idx-1],items[idx]] = [items[idx],items[idx-1]]; }
      if(act==='down' && idx<items.length-1){ [items[idx+1],items[idx]] = [items[idx],items[idx+1]]; }
      KidsApp.Store.setChants(items,'ko');
      render();
    }

    addBtn.addEventListener('click', ()=>{
      const title = inputTitle.value.trim();
      const url = inputUrl.value.trim();
      if(!url){ alert('링크를 입력해 주세요'); return; }
      const embed = KidsApp.YouTube.embedUrl(url);
      if(!embed){ alert('알 수 없는 링크 형식입니다'); return; }
      const items = KidsApp.Store.getChants('ko');
      items.push({ title: title || '무제', embed });
      KidsApp.Store.setChants(items,'ko');
      inputTitle.value=''; inputUrl.value='';
      render();
    });

    exportBtn.addEventListener('click', ()=>{
      const data = JSON.stringify(KidsApp.Store.getChants('ko'), null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chants.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    clearBtn.addEventListener('click', ()=>{
      if(confirm('영상 목록을 모두 삭제할까요?')){
        KidsApp.Store.setChants([], 'ko');
        render();
      }
    });

    // init
    render();
  </script>
</body>
</html>
